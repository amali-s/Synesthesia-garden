<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <!-- One tile of stem: horizontal tangents at both ends so edges join and meet corners. -->
    <path id="stem-edge" d="M0,10 C10,10 10,3.8 20,10 C30,16.2 30,10 40,10"/>
    <g id="leaf">
      <path d="M0,0 C1.8,-4 7.4,-2.6 0,9.2 C-7.4,-2.6 -1.8,-4 0,0 Z" fill="#1C5E3B"/>
      <path d="M0,0.5 C1.4,-3 5.8,-2 0,7.4 C-5.8,-2 -1.4,-3 0,0.5 Z" fill="#2F6F42"/>
      <path d="M0,1.4 C0.2,3.6 0.1,5.4 0,7" fill="none" stroke="#A5C5A3" stroke-width="0.65" stroke-linecap="round"/>
    </g>
    <g id="edge-run">
      <use href="#stem-edge" fill="none" stroke="#1C5E3B" stroke-width="6.4" stroke-linecap="butt"/>
      <use href="#stem-edge" fill="none" stroke="#2F6F42" stroke-width="4.4" stroke-linecap="butt"/>
      <path d="M6,9.2 C12,5.4 14,5.2 20,10 C26,14.8 28,14.4 34,10.6" fill="none" stroke="#A5C5A3" stroke-width="1.15" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(12.2,5.1) rotate(-26) scale(0.78)"/>
      <use href="#leaf" transform="translate(28.4,14.9) rotate(154) scale(0.78)"/>
      <circle cx="20" cy="10" r="1.15" fill="#1C5E3B"/>
      <circle cx="20.35" cy="9.55" r="0.45" fill="#A5C5A3"/>
    </g>
    <g id="corner-run">
      <path d="M20,10 C13.6,10 10,13.6 10,20" fill="none" stroke="#1C5E3B" stroke-width="6.4" stroke-linecap="butt"/>
      <path d="M20,10 C13.6,10 10,13.6 10,20" fill="none" stroke="#2F6F42" stroke-width="4.4" stroke-linecap="butt"/>
      <path d="M18.2,9.2 C14.2,9.4 10.8,13.4 10.8,17.6" fill="none" stroke="#A5C5A3" stroke-width="1.15" stroke-linecap="round"/>
      <path d="M12.4,12.2 Q7.2,6.4 3.2,7.6 T2.6,2.8" fill="none" stroke="#1C5E3B" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M12.4,12.2 Q7.2,6.4 3.2,7.6 T2.6,2.8" fill="none" stroke="#2F6F42" stroke-width="1.05" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(6.4,6.2) rotate(-48) scale(0.92)"/>
      <use href="#leaf" transform="translate(15.6,4.4) rotate(8) scale(0.72)"/>
    </g>
  </defs>

  <rect width="80" height="80" fill="#A5C5A3"/>

  <g id="tl"><use href="#corner-run"/></g>
  <g id="tr" transform="translate(80,0) rotate(90)"><use href="#corner-run"/></g>
  <g id="br" transform="translate(80,80) rotate(180)"><use href="#corner-run"/></g>
  <g id="bl" transform="translate(0,80) rotate(270)"><use href="#corner-run"/></g>

  <g id="top" transform="translate(20,0)"><use href="#edge-run"/></g>
  <g id="right" transform="translate(80,20) rotate(90)"><use href="#edge-run"/></g>
  <g id="bottom" transform="translate(60,80) rotate(180)"><use href="#edge-run"/></g>
  <g id="left" transform="translate(20,20) rotate(90)"><use href="#edge-run"/></g>
</svg>
